# The ecosystem was left as the template's empty string, which makes the whole
# file inert - Dependabot parses it, matches nothing, and reports nothing. This
# repo is TypeScript with a package.json at the root, and it also pins GitHub
# Actions across five workflows.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR a week for the routine bumps rather than one per package.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
