# Manual release. The only way scorpio releases.
#
#   gh workflow run release.yml -R EduIDE/scorpio --ref main -f version=2.2.0
#   gh workflow run release.yml -R EduIDE/scorpio --ref my-branch -f version=2.2.0-rc.1
#
# A stable version publishes the vsix to the GitHub Release and to Open VSX.
# A release candidate (-rc.N) only attaches the vsix to a prerelease on GitHub.
#
# A release created with GITHUB_TOKEN triggers no other workflow, so the
# packaging is called from here instead of being triggered by the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 2.2.0, or 2.2.0-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Draft GitHub Release
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "v"

  package:
    name: Package
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  assets:
    name: Attach vsix
    needs: [release, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-${{ inputs.version }}.vsix
          path: .

      # The release is still a draft here, so --clobber only makes a rerun work.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber "./artemis-scorpio-${{ inputs.version }}.vsix"

  # Stays in this file and in environment `prod`: the Open VSX trusted publisher
  # is registered for release.yml in this repository (and that environment).
  publish:
    name: Publish to Open VSX
    needs: [release, assets]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Open VSX trusted publishing exchanges the workflow's OIDC token for a short-lived one.
      id-token: write
    environment: prod
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: scorpio-${{ inputs.version }}.vsix
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Trusted publisher registered on open-vsx.org for aet-tum.artemis-scorpio, so no token is stored.
      - name: Publish to VSX Registry
        run: npx ovsx@1.3.0 publish --trusted-publishing "./artemis-scorpio-${{ inputs.version }}.vsix"

  verify:
    name: Verify
    needs: [release, assets, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.assets.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "artemis-scorpio-${VERSION}.vsix"
          if [[ "$PRERELEASE" == "false" ]]; then
            curl -fsS "https://open-vsx.org/api/aet-tum/artemis-scorpio/${VERSION}" | jq -e ".version == \"${VERSION}\""
          fi
          echo "## Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # Last: publishing the draft creates the tag. Until here a failed job leaves
  # a draft and no tag.
  # verify runs after a skipped Open VSX job (release candidate); without this
  # condition that skip would also skip publishing the release.
  publish-release:
    needs: [release, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
